kind: Secret
metadata:
  name: product-postgres-secret
  namespace: free-ebay
type: Opaque
stringData:
  POSTGRES_DB: product_service
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: "${PRODUCT_POSTGRES_PASSWORD}"
---
apiVersion: v1
kind: Secret
metadata:
  name: payment-postgres-secret
  namespace: free-ebay
type: Opaque
stringData:
  POSTGRES_DB: payment_db
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: "${PAYMENT_POSTGRES_PASSWORD}"
---
apiVersion: v1
kind: Secret
metadata:
  name: accounting-postgres-secret
  namespace: free-ebay
type: Opaque
stringData:
  POSTGRES_DB: accounting_db
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: "${ACCOUNTING_POSTGRES_PASSWORD}"
---
apiVersion: v1
kind: Secret
metadata:
  name: email-postgres-secret
  namespace: free-ebay
type: Opaque
stringData:
  POSTGRES_DB: email_service
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: "${EMAIL_POSTGRES_PASSWORD}"
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-write-secret
  namespace: free-ebay
type: Opaque
stringData:
  POSTGRES_PASSWORD: "${ORDER_WRITE_POSTGRES_PASSWORD}"
  POSTGRES_USER: order
  POSTGRES_DB: order
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-read-secret
  namespace: free-ebay
type: Opaque
stringData:
  POSTGRES_PASSWORD: "${ORDER_READ_POSTGRES_PASSWORD}"
  POSTGRES_USER: order_read
  POSTGRES_DB: order_read
---
apiVersion: v1
kind: Secret
metadata:
  name: order-service-secret
  namespace: free-ebay
type: Opaque
stringData:
  ConnectionStrings__Postgres: "Host=postgres-write;Port=5432;Database=order;Username=order;Password=${ORDER_WRITE_POSTGRES_PASSWORD}"
  ConnectionStrings__PostgresReadModel: "Host=postgres-read;Port=5432;Database=order_read;Username=order_read;Password=${ORDER_READ_POSTGRES_PASSWORD}"
  ConnectionStrings__Redis: redis:6379
  Shipping__ApiKey: "${SHIPPING_API_KEY}"
  # Must match ops-console-service-secret's InternalServices__OpsConsoleApiKey below —
  # AdminOpsGrpcService rejects every call with PermissionDenied if these diverge.
  # The generator renders one value into all four slots.
  InternalServices__OpsConsoleApiKey: "${OPS_CONSOLE_INTERNAL_API_KEY}"
  # Must match accounting-service-secret's InternalServices__AccountingApiKey below —
  # Accounting's ApiKeyAuthInterceptor rejects every call with PermissionDenied if these diverge.
  InternalServices__AccountingApiKey: "${ORDER_ACCOUNTING_API_KEY}"
---
apiVersion: v1
kind: Secret
metadata:
  name: auth-service-secret
  namespace: free-ebay
type: Opaque
stringData:
  ConnectionStrings__Postgres: "Host=auth-postgres;Port=5432;Database=auth_service;Username=postgres;Password=${AUTH_POSTGRES_PASSWORD}"
  # RS256 PRIVATE key (base64 of a PKCS#8 PEM). Auth is the ONLY holder — verifiers get the
  # public half from the generated jwt-public-config ConfigMap. Generated out-of-band;
  # a private key must never be committed, not even a "dev" one.
  Jwt__PrivateKeyBase64: "${JWT_PRIVATE_KEY_BASE64}"
---
apiVersion: v1
kind: Secret
metadata:
  name: user-service-secret
  namespace: free-ebay
type: Opaque
stringData:
  ConnectionStrings__Postgres: "Host=user-postgres;Port=5432;Database=user_service;Username=postgres;Password=${USER_POSTGRES_PASSWORD}"
---
apiVersion: v1
kind: Secret
metadata:
  name: inventory-service-secret
  namespace: free-ebay
type: Opaque
stringData:
  ConnectionStrings__Postgres: "Host=inventory-postgres;Port=5432;Database=inventory_service;Username=postgres;Password=${INVENTORY_POSTGRES_PASSWORD}"
  # Must match ops-console-service-secret's InternalServices__OpsConsoleApiKey below —
  # AdminInventoryGrpcService rejects every call with PermissionDenied if these diverge.
  InternalServices__OpsConsoleApiKey: "${OPS_CONSOLE_INTERNAL_API_KEY}"
---
apiVersion: v1
kind: Secret
metadata:
  name: product-service-secret
  namespace: free-ebay
type: Opaque
stringData:
  ConnectionStrings__Postgres: "Host=product-postgres;Port=5432;Database=product_service;Username=postgres;Password=${PRODUCT_POSTGRES_PASSWORD}"
---
apiVersion: v1
kind: Secret
metadata:
  name: payment-service-secret
  namespace: free-ebay
type: Opaque
stringData:
  ConnectionStrings__Postgres: "Host=payment-postgres;Port=5432;Database=payment_db;Username=postgres;Password=${PAYMENT_POSTGRES_PASSWORD}"
  # Issued by Stripe — supply via env when running the generator. Empty is only valid
  # while Stripe__ProviderType is Fake.
  Stripe__SecretKey: "${STRIPE_SECRET_KEY}"
  Stripe__WebhookSecret: "${STRIPE_WEBHOOK_SECRET}"
  OrderCallback__SharedSecret: "${ORDER_CALLBACK_SHARED_SECRET}"
  # Must match ops-console-service-secret's InternalServices__OpsConsoleApiKey below —
  # AdminPaymentGrpcService rejects every call with PermissionDenied if these diverge.
  InternalServices__OpsConsoleApiKey: "${OPS_CONSOLE_INTERNAL_API_KEY}"
---
apiVersion: v1
kind: Secret
metadata:
  name: accounting-service-secret
  namespace: free-ebay
type: Opaque
stringData:
  ConnectionStrings__Postgres: "Host=accounting-postgres;Port=5432;Database=accounting_db;Username=postgres;Password=${ACCOUNTING_POSTGRES_PASSWORD}"
  # Must match order-service-secret's InternalServices__AccountingApiKey above — the only
  # caller of this gRPC API is Order, and ApiKeyAuthInterceptor is fail-closed.
  InternalServices__AccountingApiKey: "${ORDER_ACCOUNTING_API_KEY}"
  # Separate credential for the AdminAccountingService read/adjustment surface. OpsConsole holds
  # this one and therefore cannot reach ReverseRevenue with it.
  InternalServices__OpsConsoleApiKey: "${OPS_CONSOLE_INTERNAL_API_KEY}"
  # Ledger drift pages a dedicated finance channel, NOT Order's saga channel. Use a separate
  # bot and chat so a money-integrity alert is never buried under saga noise.
  IncidentReporter__Telegram__Enabled: "${ACCOUNTING_TELEGRAM_ENABLED}"
  IncidentReporter__Telegram__BotToken: "${ACCOUNTING_TELEGRAM_BOT_TOKEN}"
  IncidentReporter__Telegram__ChatId: "${ACCOUNTING_TELEGRAM_CHAT_ID}"
---
apiVersion: v1
kind: Secret
metadata:
  name: email-service-secret
  namespace: free-ebay
type: Opaque
stringData:
  ConnectionStrings__Postgres: "Host=email-postgres;Port=5432;Database=email_service;Username=postgres;Password=${EMAIL_POSTGRES_PASSWORD}"
  # SMTP credentials come from the mail provider — supply via env. Empty works against
  # the in-cluster MailHog only.
  Email__Username: "${EMAIL_SMTP_USERNAME}"
  Email__Password: "${EMAIL_SMTP_PASSWORD}"
---
apiVersion: v1
kind: Secret
metadata:
  name: gateway-service-secret
  namespace: free-ebay
type: Opaque
stringData:
  # Shared with the carrier that signs the delivery webhooks — supply via env so both
  # sides agree, otherwise every webhook is rejected.
  WebhookSecurity__ShippingSharedSecret: "${DPD_WEBHOOK_SECRET}"
  WebhookSecurity__PplSharedSecret: "${PPL_WEBHOOK_SECRET}"
---
apiVersion: v1
kind: Secret
metadata:
  name: ops-console-service-secret
  namespace: free-ebay
type: Opaque
stringData:
  # Gates every human/frontend request into the OpsConsole backend (X-Admin-Api-Key
  # header) — must match ops-console-web-secret's OPS_CONSOLE_ADMIN_API_KEY below.
  AdminApiKey: "${OPS_CONSOLE_ADMIN_API_KEY}"
  # Sent as x-internal-api-key on every outbound gRPC call to Order/Payment/Inventory's
  # admin services — must match the InternalServices__OpsConsoleApiKey value on
  # order-service-secret, payment-service-secret, and inventory-service-secret above.
  InternalServices__OpsConsoleApiKey: "${OPS_CONSOLE_INTERNAL_API_KEY}"
  # RS256: OpsConsole verifies operator JWTs with Auth's PUBLIC key (Jwt__PublicKeyBase64 in
  # the jwt-public-config ConfigMap) and cannot mint them. No signing key lives here.
---
apiVersion: v1
kind: Secret
metadata:
  name: ops-console-web-secret
  namespace: free-ebay
type: Opaque
stringData:
  # Sent as X-Admin-Api-Key to the OpsConsole backend — must match
  # ops-console-service-secret's AdminApiKey above.
  OPS_CONSOLE_ADMIN_API_KEY: "${OPS_CONSOLE_ADMIN_API_KEY}"
