# Secret TEMPLATE — committed to git on purpose. It contains ONLY substitution tokens,
# never real key material.
#
# Render it with:  ./scripts/generate-k8s-secrets.sh
# which writes the gitignored k8s/secrets.generated.yaml (fresh RS256 keypair + random
# passwords) and k8s/jwt-public-config.generated.yaml (the matching PUBLIC half).
#
# Values that cannot be generated (Stripe, SMTP, carrier webhook secrets shared with a
# provider) are read from the environment by that script — see k8s/README.md.
#
# NEVER paste a rendered value back into this file.
apiVersion: v1
kind: Secret
metadata:
  name: auth-postgres-secret
  namespace: free-ebay
type: Opaque
stringData:
  POSTGRES_DB: auth_service
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: "${AUTH_POSTGRES_PASSWORD}"
---
apiVersion: v1
kind: Secret
metadata:
  name: user-postgres-secret
  namespace: free-ebay
type: Opaque
stringData:
  POSTGRES_DB: user_service
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: "${USER_POSTGRES_PASSWORD}"
---
apiVersion: v1
kind: Secret
metadata:
  name: inventory-postgres-secret
  namespace: free-ebay
type: Opaque
stringData:
  POSTGRES_DB: inventory_service
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: "${INVENTORY_POSTGRES_PASSWORD}"
---
